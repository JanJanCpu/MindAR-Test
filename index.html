<html>
  <head>
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <!-- 1. The custom rotation script -->
    <script>
      AFRAME.registerComponent("rotate-on-click", {
        init: function () {
          this.el.addEventListener("click", () => {
            const currentRot = this.el.getAttribute("rotation");
            this.el.setAttribute("rotation", {
              x: currentRot.x,
              y: currentRot.y + 90,
              z: currentRot.z,
            });
          });
        },
      });
    </script>
  </head>
  
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- 2. The camera with the raycaster to detect screen taps -->
      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-entity
          cursor="fuse: false; rayOrigin: mouse;"
          raycaster="objects: .clickable"
        ></a-entity>
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- 3. The Preset Block: A red box with the clickable class -->
        <a-box
          class="clickable"
          rotate-on-click
          color="red"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 0 0"
        ></a-box>
        
      </a-entity>
    </a-scene>

    <!-- 4. Offline Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("Service Worker registered!", reg))
            .catch((err) =>
              console.error("Service Worker registration failed: ", err),
            );
        });
      }
    </script>
  </body>
</html>
