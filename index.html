<html>
  <head>
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      AFRAME.registerComponent('rotate-on-click', {
        init: function () {
          this.el.addEventListener('click', () => {
            const currentRot = this.el.getAttribute('rotation');
            // Changed to 45 degrees so you can actually see the cube turn
            this.el.setAttribute('rotation', {
              x: currentRot.x,
              y: currentRot.y + 45, 
              z: currentRot.z
            });
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Notice we removed the <a-assets> section entirely since there's no file to load -->

      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-entity cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable"></a-entity>
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- A lightweight A-Frame primitive block colored Orange -->
        <a-box
          color="#FF5722"
          class="clickable"
          rotate-on-click
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 0 0"
        ></a-box>
        
      </a-entity>
    </a-scene>
    
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("Service Worker registered!", reg))
            .catch((err) =>
              console.error("Service Worker registration failed: ", err)
            );
        });
      }
    </script>
  </body>
</html>
