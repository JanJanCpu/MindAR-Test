<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- 1. Custom Interaction Script -->
    <script>
      AFRAME.registerComponent('tap-interact', {
        init: function () {
          // Listen for the click event
          this.el.addEventListener('click', () => {
            // Get current rotation
            const currentRotation = this.el.getAttribute('rotation');
            // Add 90 degrees to the Y axis
            this.el.setAttribute('rotation', {
              x: currentRotation.x,
              y: currentRotation.y + 90,
              z: currentRotation.z
            });
          });
        }
      });
    </script>
  </head>
  
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="myModel" src="./model.glb"></a-asset-item>
      </a-assets>

      <!-- 2. Camera with Raycaster -->
      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-entity cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable"></a-entity>
      </a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 3. Model with the 'clickable' class and the 'tap-interact' component -->
        <a-gltf-model src="#myModel" class="clickable" tap-interact position="0 0 0" scale="0.5 0.5 0.5" rotation="0 0 0"></a-gltf-model>
      </a-entity>
      
    </a-scene>
  </body>
</html>
