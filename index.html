<html>
  <head>
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- 1. Asset Management: Preload your 3D model -->
      <a-assets>
        <a-asset-item id="myModel" src="./test.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 2. Call the preloaded model by its ID -->
        <html>
          <head>
            <link rel="manifest" href="./manifest.json" />
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1"
            />
            <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

            <!-- 1. The custom rotation script -->
            <script>
              AFRAME.registerComponent("rotate-on-click", {
                init: function () {
                  this.el.addEventListener("click", () => {
                    const currentRot = this.el.getAttribute("rotation");
                    this.el.setAttribute("rotation", {
                      x: currentRot.x,
                      y: currentRot.y + 90,
                      z: currentRot.z,
                    });
                  });
                },
              });
            </script>
          </head>
          <body>
            <a-scene
              mindar-image="imageTargetSrc: ./targets.mind;"
              vr-mode-ui="enabled: false"
              device-orientation-permission-ui="enabled: false"
            >
              <a-assets>
                <a-asset-item id="myModel" src="./test.glb"></a-asset-item>
              </a-assets>

              <!-- 2. The camera now has a raycaster to detect screen taps -->
              <a-camera position="0 0 0" look-controls="enabled: false">
                <a-entity
                  cursor="fuse: false; rayOrigin: mouse;"
                  raycaster="objects: .clickable"
                ></a-entity>
              </a-camera>

              <a-entity mindar-image-target="targetIndex: 0">
                <!-- 3. Added class="clickable" and the rotate-on-click component -->
                <a-gltf-model
                  src="#myModel"
                  class="clickable"
                  rotate-on-click
                  position="0 0 0"
                  scale="0.5 0.5 0.5"
                  rotation="0 0 0"
                ></a-gltf-model>
              </a-entity>
            </a-scene>

            <script>
              if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                  navigator.serviceWorker
                    .register("./sw.js")
                    .then((reg) =>
                      console.log("Service Worker registered!", reg),
                    )
                    .catch((err) =>
                      console.error(
                        "Service Worker registration failed: ",
                        err,
                      ),
                    );
                });
              }
            </script>
          </body>
        </html>
        <a-gltf-model
          src="#myModel"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 0 0"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("Service Worker registered!", reg))
            .catch((err) =>
              console.error("Service Worker registration failed: ", err),
            );
        });
      }
    </script>
  </body>
</html>
